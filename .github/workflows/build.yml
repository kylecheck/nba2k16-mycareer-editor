name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest discover -s tests -v
  linux-package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: NBA2K16-Linux
          path: dist/NBA2K16-Linux.zip
  windows-package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m PyInstaller --noconfirm --clean --onedir --console --name NBA2K16-MyCareer-Editor --add-data "fields.json;." --add-data "build.json;." app.py
      - shell: pwsh
        run: |
          Copy-Item README.md dist/NBA2K16-MyCareer-Editor/README.md
          Copy-Item LICENSE dist/NBA2K16-MyCareer-Editor/LICENSE
          $process = Start-Process dist/NBA2K16-MyCareer-Editor/NBA2K16-MyCareer-Editor.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged app self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: NBA2K16-Windows-x64-preview
          path: dist/NBA2K16-MyCareer-Editor/
  release:
    needs: [linux-package, windows-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - run: |
          cd packages/NBA2K16-Windows-x64-preview
          zip -r ../../NBA2K16-Windows-x64-preview.zip .
      - name: Publish new version after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'VERSION must contain a version such as v1.2 or v1.2.1'
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; preserving it."
            exit 0
          fi
          gh release create "$version" \
            packages/NBA2K16-Linux/NBA2K16-Linux.zip \
            NBA2K16-Windows-x64-preview.zip \
            --target "$GITHUB_SHA" \
            --title "NBA 2K16 MyCareer Editor $version" \
            --notes 'Native offline MyCareer editor with height up to 10 feet, wingspan, weight, attributes, max attributes, and all badges. Linux/Steam Deck version tested with the game. Windows x64 preview passes automated checks but still needs in-game testing. Download the ZIP for your platform, extract the whole folder, and follow its README. Compatibility is limited to the verified NBA2K16 executable build.'
